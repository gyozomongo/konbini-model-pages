<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雨夜便利店街角 — 微缩三渲二景观</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 38%, #162038 0%, #0b101d 58%, #05070e 100%);
      cursor: grab;
    }
    body:active {
      cursor: grabbing;
    }
    canvas {
      display: block;
      width: 100vw;
      height: 100vh;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Reflector } from 'three/addons/objects/Reflector.js';

// ============================================================================
// 1. RENDERER, SCENE & CAMERA SETUP (NO UI, PURE DIORAMA VIEW)
// ============================================================================
const renderer = new THREE.WebGLRenderer({
  antialias: true,
  powerPreference: 'high-performance'
});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0b1222, 0.016);

const camera = new THREE.PerspectiveCamera(
  33,
  window.innerWidth / window.innerHeight,
  0.1,
  150
);
camera.position.set(17.5, 11.8, 18.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-0.4, 1.9, -0.4);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.maxPolarAngle = Math.PI / 2 - 0.02;
controls.minPolarAngle = 0.12;
controls.minDistance = 6.5;
controls.maxDistance = 38;
controls.update();

// Root group for the entire square diorama model
const diorama = new THREE.Group();
scene.add(diorama);

// ============================================================================
// 2. THREE-TO-TWO (CEL-SHADING) & ANIME OUTLINE UTILITIES
// ============================================================================
function createToonGradient(steps = 4, minBrightness = 0.38) {
  const data = new Uint8Array(steps * 4);
  for (let i = 0; i < steps; i++) {
    const t = i / (steps - 1);
    const v = Math.round((minBrightness + (1 - minBrightness) * Math.pow(t, 0.85)) * 255);
    data[i * 4 + 0] = v;
    data[i * 4 + 1] = v;
    data[i * 4 + 2] = Math.min(255, v + Math.round((1 - t) * 18)); // subtle cool shadow tint
    data[i * 4 + 3] = 255;
  }
  const tex = new THREE.DataTexture(data, steps, 1, THREE.RGBAFormat);
  tex.minFilter = THREE.NearestFilter;
  tex.magFilter = THREE.NearestFilter;
  tex.needsUpdate = true;
  return tex;
}

const toonGrad4 = createToonGradient(4, 0.35);
const toonGrad3 = createToonGradient(3, 0.48);

const outlineMaterialCache = new Map();
function getOutlineMaterial(colorHex = 0x0d1322, opacity = 0.88) {
  const key = `${colorHex}_${opacity}`;
  if (!outlineMaterialCache.has(key)) {
    outlineMaterialCache.set(
      key,
      new THREE.MeshBasicMaterial({
        color: colorHex,
        side: THREE.BackSide,
        transparent: opacity < 1,
        opacity
      })
    );
  }
  return outlineMaterialCache.get(key);
}

function createToonMat(color, opts = {}) {
  return new THREE.MeshToonMaterial({
    color,
    gradientMap: opts.soft ? toonGrad3 : toonGrad4,
    map: opts.map || null,
    emissive: opts.emissive !== undefined ? opts.emissive : 0x000000,
    emissiveMap: opts.emissiveMap || null,
    emissiveIntensity: opts.emissiveIntensity !== undefined ? opts.emissiveIntensity : 1.0,
    transparent: opts.transparent || false,
    opacity: opts.opacity !== undefined ? opts.opacity : 1.0,
    side: opts.side || THREE.FrontSide
  });
}

function addAnimeMesh(parent, geometry, material, opts = {}) {
  const mesh = new THREE.Mesh(geometry, material);
  if (opts.position) mesh.position.set(...opts.position);
  if (opts.rotation) mesh.rotation.set(...opts.rotation);
  if (opts.scale) mesh.scale.set(...opts.scale);
  mesh.castShadow = opts.castShadow !== undefined ? opts.castShadow : true;
  mesh.receiveShadow = opts.receiveShadow !== undefined ? opts.receiveShadow : true;

  if (opts.outline !== false) {
    const thickness = opts.outlineThickness || 0.022;
    const outGeo = geometry.clone();
    // Scale slightly along normals / bounding for clean cel-shaded line art
    const outMesh = new THREE.Mesh(outGeo, getOutlineMaterial(opts.outlineColor || 0x0d1220));
    outMesh.scale.set(1 + thickness, 1 + thickness, 1 + thickness);
    outMesh.castShadow = false;
    outMesh.receiveShadow = false;
    mesh.add(outMesh);
  }

  // Optional crisp edge ink line for boxy architectural objects
  if (opts.edgeLine) {
    const edges = new THREE.EdgesGeometry(geometry, opts.edgeThreshold || 28);
    const lineMat = new THREE.LineBasicMaterial({
      color: opts.edgeColor || 0x0e1526,
      transparent: true,
      opacity: opts.edgeOpacity || 0.55
    });
    const line = new THREE.LineSegments(edges, lineMat);
    mesh.add(line);
  }

  parent.add(mesh);
  return mesh;
}

// ============================================================================
// 3. PROCEDURAL ANIME 2D CANVAS TEXTURES
// ============================================================================
function makeCanvasTexture(width, height, drawFn) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  const ctx = canvas.getContext('2d');
  drawFn(ctx, width, height);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.anisotropy = 8;
  return { tex, canvas, ctx };
}

// 3.1 Konbini Fascia Signboard Texture (Front & Side)
function createFasciaTexture(w = 1024, h = 256, mainText = 'HOSHIMART 星マート', subText = '24HOURS OPEN  酒・たばこ・ATM') {
  return makeCanvasTexture(w, h, (ctx, width, height) => {
    // Warm glowing cream background
    const bg = ctx.createLinearGradient(0, 0, 0, height);
    bg.addColorStop(0, '#fffdf7');
    bg.addColorStop(1, '#f4efe1');
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, width, height);

    // Classic Japanese Konbini tricolor bands at bottom and top
    ctx.fillStyle = '#00a86b'; // Emerald green
    ctx.fillRect(0, 0, width, 28);
    ctx.fillStyle = '#ff6b1a'; // Warm vibrant orange
    ctx.fillRect(0, height - 62, width, 30);
    ctx.fillStyle = '#0077cc'; // Cerulean blue
    ctx.fillRect(0, height - 32, width, 32);

    // Star emblem box on the left
    ctx.fillStyle = '#ff6b1a';
    ctx.beginPath();
    ctx.roundRect(36, 42, 132, 132, 18);
    ctx.fill();
    ctx.strokeStyle = '#182235';
    ctx.lineWidth = 5;
    ctx.stroke();

    // Draw 4-point anime star + crescent inside emblem
    ctx.fillStyle = '#fff9d6';
    ctx.beginPath();
    const cx = 102, cy = 108;
    for (let i = 0; i < 8; i++) {
      const r = i % 2 === 0 ? 48 : 18;
      const a = (i * Math.PI) / 4;
      const x = cx + Math.cos(a) * r;
      const y = cy + Math.sin(a) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();

    // Main title text
    ctx.fillStyle = '#142238';
    ctx.font = '900 66px "Hiragino Sans", "Meiryo", "Microsoft YaHei", sans-serif';
    ctx.fillText(mainText, 196, 114);

    // Subtitle badge
    ctx.fillStyle = '#008c5a';
    ctx.font = 'bold 34px "Hiragino Sans", "Meiryo", "Microsoft YaHei", sans-serif';
    ctx.fillText(subText, 200, 164);

    // Subtle vertical panel seam lines
    ctx.strokeStyle = 'rgba(20, 34, 56, 0.16)';
    ctx.lineWidth = 3;
    for (let x = 128; x < width; x += 128) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }
  }).tex;
}

const frontFasciaTex = createFasciaTexture(1024, 256, 'HOSHIMART 星マート', '24H 営業 ・ お弁当 ・ 淹れたてコーヒー ・ ATM');
const sideFasciaTex = createFasciaTexture(768, 256, '星マート 24H', 'お酒 ・ たばこ ・ 宅配便 ・ 駐車場あり');

// 3.2 Vending Machine Front Texture
function createVendingMachineTex(themeColor = '#e63946', accentColor = '#fff1d0') {
  return makeCanvasTexture(512, 1024, (ctx, w, h) => {
    ctx.fillStyle = themeColor;
    ctx.fillRect(0, 0, w, h);

    // Outer frame border
    ctx.strokeStyle = '#121824';
    ctx.lineWidth = 14;
    ctx.strokeRect(7, 7, w - 14, h - 14);

    // Illuminated display window (upper 58%)
    ctx.fillStyle = '#fff9eb';
    ctx.fillRect(34, 44, w - 68, 530);
    ctx.strokeStyle = '#1d2638';
    ctx.lineWidth = 8;
    ctx.strokeRect(34, 44, w - 68, 530);

    // 3 Shelves of colorful drinks inside window
    const drinkColors = ['#ff4d6d', '#00b4d8', '#4cc9f0', '#ffbe0b', '#38b000', '#7209b7', '#fb5607', '#80ed99'];
    for (let row = 0; row < 3; row++) {
      const sy = 68 + row * 170;
      // Shelf base + price bar
      ctx.fillStyle = '#2b3548';
      ctx.fillRect(42, sy + 115, w - 84, 26);
      // Warm/Cold badges + buttons
      for (let col = 0; col < 7; col++) {
        const dx = 54 + col * 58;
        const c = drinkColors[(row * 7 + col) % drinkColors.length];
        // Bottle/can silhouette
        ctx.fillStyle = c;
        ctx.beginPath();
        ctx.roundRect(dx, sy + 24, 40, 88, 8);
        ctx.fill();
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(dx + 4, sy + 48, 32, 26);
        // Cap
        ctx.fillStyle = row === 2 ? '#e63946' : '#1d3557';
        ctx.fillRect(dx + 10, sy + 12, 20, 12);

        // Hot (Red) / Cold (Blue) indicator bar
        ctx.fillStyle = row === 2 ? '#ff4d4f' : '#1890ff';
        ctx.fillRect(dx + 2, sy + 118, 36, 9);
        // Push button with green LED
        ctx.fillStyle = '#111827';
        ctx.fillRect(dx + 6, sy + 130, 28, 10);
        ctx.fillStyle = '#52c41a';
        ctx.fillRect(dx + 16, sy + 133, 8, 4);
      }
    }

    // Middle control panel (coin slot, digital LED, bill validator)
    ctx.fillStyle = '#1c2436';
    ctx.fillRect(34, 600, w - 68, 150);
    // Glowing brand banner on left of middle panel
    ctx.fillStyle = accentColor;
    ctx.fillRect(48, 616, 235, 118);
    ctx.fillStyle = '#121824';
    ctx.font = '900 34px sans-serif';
    ctx.fillText('DRINK 24H', 66, 668);
    ctx.font = 'bold 22px sans-serif';
    ctx.fillStyle = '#e63946';
    ctx.fillText('つめたい・あたたかい', 62, 708);

    // Digital red LED price display
    ctx.fillStyle = '#090d16';
    ctx.fillRect(305, 622, 145, 50);
    ctx.fillStyle = '#ff3b30';
    ctx.font = 'bold 34px monospace';
    ctx.fillText('¥130', 332, 658);

    // Coin return lever & slot
    ctx.fillStyle = '#94a3b8';
    ctx.beginPath();
    ctx.arc(345, 706, 22, 0, Math.PI * 2);
    ctx.fill();

    // Lower pickup flap (glowing slightly from inside)
    ctx.fillStyle = '#101521';
    ctx.fillRect(52, 790, w - 104, 155);
    ctx.fillStyle = '#26334d';
    ctx.fillRect(66, 804, w - 132, 115);
    ctx.fillStyle = 'rgba(255, 240, 195, 0.25)';
    ctx.fillRect(66, 895, w - 132, 24);
  }).tex;
}

const vendingTexRed = createVendingMachineTex('#d62839', '#fff3d1');
const vendingTexBlue = createVendingMachineTex('#0077b6', '#e0f7fa');

// 3.3 Interior Floor Tile & Guide Markings Texture
const interiorFloorTex = makeCanvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#f6efe2';
  ctx.fillRect(0, 0, w, h);
  // Subtle warm grid tiles
  ctx.strokeStyle = '#ded3be';
  ctx.lineWidth = 3;
  const step = 64;
  for (let i = 0; i <= w; i += step) {
    ctx.beginPath();
    ctx.moveTo(i, 0);
    ctx.lineTo(i, h);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(0, i);
    ctx.lineTo(w, i);
    ctx.stroke();
  }
}).tex;
interiorFloorTex.wrapS = interiorFloorTex.wrapT = THREE.RepeatWrapping;
interiorFloorTex.repeat.set(4, 3);

// 3.4 Exterior Wet Road & Crosswalk & Puddle Mask Texture
const roadSurfaceTex = makeCanvasTexture(1024, 1024, (ctx, w, h) => {
  // Deep wet asphalt base
  ctx.fillStyle = '#121826';
  ctx.fillRect(0, 0, w, h);

  // Subtle asphalt grain & dark wet patches
  for (let i = 0; i < 400; i++) {
    const x = Math.random() * w;
    const y = Math.random() * h;
    const r = 8 + Math.random() * 55;
    ctx.fillStyle = i % 2 === 0 ? 'rgba(8, 12, 22, 0.35)' : 'rgba(32, 46, 72, 0.18)';
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // White road lane lines & stop lines
  ctx.fillStyle = '#d8e2f0';
  // Front road (+Z) zebra crosswalk stripes (bottom-right area)
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(580, 690 + i * 38, 165, 22);
  }
  // Right road (+X) zebra crosswalk stripes
  for (let i = 0; i < 6; i++) {
    ctx.fillRect(690 + i * 38, 520, 22, 145);
  }

  // Stop lines
  ctx.fillRect(535, 695, 16, 210);
  ctx.fillRect(695, 485, 210, 16);

  // Parking bay lines in front of left side of store
  ctx.strokeStyle = '#e2e8f0';
  ctx.lineWidth = 8;
  ctx.strokeRect(110, 680, 195, 275);
  ctx.strokeRect(315, 680, 195, 275);

  // "P" parking stencil
  ctx.fillStyle = 'rgba(226, 232, 240, 0.85)';
  ctx.font = 'bold 54px sans-serif';
  ctx.fillText('P', 188, 845);
  ctx.fillText('軽', 392, 845);
}).tex;

// 3.5 Sidewalk Pavement Tile Texture
const sidewalkTex = makeCanvasTexture(512, 512, (ctx, w, h) => {
  ctx.fillStyle = '#2b3448';
  ctx.fillRect(0, 0, w, h);
  const ts = 64;
  for (let y = 0; y < h; y += ts) {
    for (let x = 0; x < w; x += ts) {
      const shade = ((x + y) / ts) % 2 === 0 ? '#313b52' : '#283144';
      ctx.fillStyle = shade;
      ctx.fillRect(x + 2, y + 2, ts - 4, ts - 4);
    }
  }
  // Yellow tactile paving strip (盲道) along the outer edge
  ctx.fillStyle = '#d4a017';
  ctx.fillRect(0, h - 48, w, 34);
  ctx.fillRect(w - 48, 0, 34, h);
  ctx.fillStyle = '#b5850b';
  for (let i = 8; i < w; i += 24) {
    ctx.fillRect(i, h - 42, 12, 22);
    ctx.fillRect(w - 42, i, 22, 12);
  }
}).tex;

// 3.6 Animated Rain-Streaked Window Texture (updated in animation loop!)
const windowRainData = makeCanvasTexture(512, 256, () => {});
const windowRainDrops = Array.from({ length: 48 }, () => ({
  x: Math.random() * 512,
  y: Math.random() * 256,
  len: 18 + Math.random() * 36,
  speed: 28 + Math.random() * 55,
  thickness: 1.4 + Math.random() * 1.8
}));

function updateWindowRainTexture(dt) {
  const { ctx, canvas, tex } = windowRainData;
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Soft condensation mist at top and bottom edges of glass
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, 'rgba(190, 225, 255, 0.22)');
  grad.addColorStop(0.2, 'rgba(190, 225, 255, 0.04)');
  grad.addColorStop(0.82, 'rgba(255, 220, 170, 0.05)');
  grad.addColorStop(1, 'rgba(180, 220, 255, 0.26)');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Sliding raindrop trails
  for (const d of windowRainDrops) {
    d.y += d.speed * dt;
    if (d.y - d.len > canvas.height) {
      d.y = -10;
      d.x = Math.random() * canvas.width;
    }
    const trailGrad = ctx.createLinearGradient(d.x, d.y - d.len, d.x, d.y);
    trailGrad.addColorStop(0, 'rgba(220, 242, 255, 0.0)');
    trailGrad.addColorStop(0.75, 'rgba(220, 242, 255, 0.45)');
    trailGrad.addColorStop(1, 'rgba(255, 255, 255, 0.9)');
    ctx.strokeStyle = trailGrad;
    ctx.lineWidth = d.thickness;
    ctx.beginPath();
    ctx.moveTo(d.x, d.y - d.len);
    ctx.lineTo(d.x + Math.sin(d.y * 0.08) * 1.8, d.y);
    ctx.stroke();

    // Bright droplet head
    ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
    ctx.beginPath();
    ctx.arc(d.x, d.y, d.thickness * 0.9, 0, Math.PI * 2);
    ctx.fill();
  }
  tex.needsUpdate = true;
}

// ============================================================================
// 4. SQUARE COLLECTIBLE DIORAMA BASE, SIDEWALK, DRAINS & WET REFLECTIVE ROAD
// ============================================================================
const BASE_SIZE = 18.0;
const BASE_THICK = 0.9;

function buildDioramaBase() {
  const baseGroup = new THREE.Group();
  diorama.add(baseGroup);

  // 1. Collector's dark architectural frame plinth
  const plinthGeo = new THREE.BoxGeometry(BASE_SIZE + 0.36, BASE_THICK, BASE_SIZE + 0.36);
  const plinthMat = createToonMat(0x131824);
  addAnimeMesh(baseGroup, plinthGeo, plinthMat, {
    position: [0, -BASE_THICK / 2 - 0.02, 0],
    outlineThickness: 0.014,
    edgeLine: true,
    edgeColor: 0x070a12
  });

  // Lower step bevel for model showcase look
  const rimGeo = new THREE.BoxGeometry(BASE_SIZE + 0.65, 0.24, BASE_SIZE + 0.65);
  const rimMat = createToonMat(0x0c101a);
  addAnimeMesh(baseGroup, rimGeo, rimMat, {
    position: [0, -BASE_THICK + 0.1, 0],
    outline: false
  });

  // Small brass collector plaque on the front-right bevel
  const plaqueGeo = new THREE.BoxGeometry(2.4, 0.28, 0.08);
  const plaqueMat = createToonMat(0xd4a853, { emissive: 0x3a2808, emissiveIntensity: 0.4 });
  addAnimeMesh(baseGroup, plaqueGeo, plaqueMat, {
    position: [4.8, -BASE_THICK / 2, BASE_SIZE / 2 + 0.19],
    outlineThickness: 0.03
  });

  // 2. Real-time Planar Mirror Reflector for Wet Road & Puddles
  const groundMirror = new Reflector(new THREE.PlaneGeometry(BASE_SIZE, BASE_SIZE), {
    clipBias: 0.003,
    textureWidth: Math.floor(window.innerWidth * 0.75),
    textureHeight: Math.floor(window.innerHeight * 0.75),
    color: 0x385078
  });
  groundMirror.rotation.x = -Math.PI / 2;
  groundMirror.position.y = 0.005;
  baseGroup.add(groundMirror);

  // 3. Semi-transparent Wet Asphalt & Road Markings Overlay (lets mirror reflections shine through puddles & wet streaks)
  const roadOverlayGeo = new THREE.PlaneGeometry(BASE_SIZE, BASE_SIZE);
  const roadOverlayMat = new THREE.MeshStandardMaterial({
    map: roadSurfaceTex,
    roughness: 0.18,
    metalness: 0.25,
    transparent: true,
    opacity: 0.74
  });
  const roadOverlay = new THREE.Mesh(roadOverlayGeo, roadOverlayMat);
  roadOverlay.rotation.x = -Math.PI / 2;
  roadOverlay.position.y = 0.012;
  roadOverlay.receiveShadow = true;
  baseGroup.add(roadOverlay);

  // 4. Glossy Puddle Lenses (extra mirror visibility zones on the street & alley)
  const puddlePositions = [
    [-2.4, 5.2, 2.2, 1.35],
    [3.6, 5.6, 2.5, 1.5],
    [6.1, 1.4, 1.6, 2.4],
    [5.8, -3.5, 1.5, 2.1],
    [-6.1, 2.2, 1.3, 1.9],
    [1.2, 6.8, 2.0, 1.2]
  ];
  const puddleMat = new THREE.MeshBasicMaterial({
    color: 0x6ba4ff,
    transparent: true,
    opacity: 0.14
  });
  for (const [px, pz, sx, sz] of puddlePositions) {
    const pGeo = new THREE.CircleGeometry(1, 24);
    const pMesh = new THREE.Mesh(pGeo, puddleMat);
    pMesh.rotation.x = -Math.PI / 2;
    pMesh.position.set(px, 0.016, pz);
    pMesh.scale.set(sx, sz, 1);
    baseGroup.add(pMesh);
  }

  // 5. Raised Street Corner Sidewalk Platform (occupies X: -9 to +3.8, Z: -9 to +3.2)
  const swWidth = 12.8;
  const swDepth = 12.2;
  const swHeight = 0.18;
  const swGeo = new THREE.BoxGeometry(swWidth, swHeight, swDepth);
  const swMat = createToonMat(0xffffff, { map: sidewalkTex });
  addAnimeMesh(baseGroup, swGeo, swMat, {
    position: [-2.6, swHeight / 2, -2.9],
    outlineThickness: 0.008,
    edgeLine: true,
    edgeColor: 0x101726
  });

  // Concrete Curb Stones along the street corner turn
  const curbMat = createToonMat(0x6c7a96);
  for (let i = 0; i < 14; i++) {
    addAnimeMesh(baseGroup, new THREE.BoxGeometry(0.88, 0.21, 0.22), curbMat, {
      position: [-8.5 + i * 0.92, 0.105, 3.2],
      outline: false,
      edgeLine: true
    });
  }
  for (let i = 0; i < 13; i++) {
    addAnimeMesh(baseGroup, new THREE.BoxGeometry(0.22, 0.21, 0.88), curbMat, {
      position: [3.8, 0.105, -8.4 + i * 0.92],
      outline: false,
      edgeLine: true
    });
  }

  // 6. Storm Drain Grates (排水沟) in the street gutter
  const grateMat = createToonMat(0x1f293d);
  const drainCoords = [
    [-4.2, 3.45, 0],
    [0.8, 3.45, 0],
    [4.05, 0.6, Math.PI / 2],
    [4.05, -4.2, Math.PI / 2]
  ];
  for (const [dx, dz, rot] of drainCoords) {
    const drainGroup = new THREE.Group();
    drainGroup.position.set(dx, 0.02, dz);
    drainGroup.rotation.y = rot;
    addAnimeMesh(drainGroup, new THREE.BoxGeometry(0.95, 0.02, 0.42), createToonMat(0x090d16), { outline: false });
    for (let b = -0.38; b <= 0.38; b += 0.11) {
      addAnimeMesh(drainGroup, new THREE.BoxGeometry(0.04, 0.03, 0.38), grateMat, {

  });
  addAnimeMesh(mirrorPole, new THREE.CylinderGeometry(0.36, 0.36, 0.08, 18), createToonMat(0xff6b1a, {
    emissive: 0xc2410c,
    emissiveIntensity: 0.4
  }), {
    position: [0.05, 3.05, 0.05],
    rotation: [Math.PI / 2, -0.5, 0]
  });
  addAnimeMesh(mirrorPole, new THREE.SphereGeometry(0.28, 14, 12), createToonMat(0x93c5fd), {
    position: [0.08, 3.05, 0.08],
    scale: [1, 1, 0.35],
    outline: false
  });
}

buildExteriorStreetProps();

// ============================================================================
// 7. WARM INTERIOR vs COOL RAINY NIGHT LIGHTING SETUP
// ============================================================================
let doorSpillLight;

function setupLighting() {
  // 1. Cool Indigo Rainy Night Hemisphere & Ambient Light
  const hemiLight = new THREE.HemisphereLight(0x3a64a8, 0x111829, 0.85);
  scene.add(hemiLight);

  // 2. Cool Moonlight / Rainy Sky Directional Light casting crisp diorama shadows
  const moonLight = new THREE.DirectionalLight(0x6e9eff, 0.95);
  moonLight.position.set(14, 22, 15);
  moonLight.castShadow = true;
  moonLight.shadow.mapSize.set(2048, 2048);
  moonLight.shadow.camera.near = 2;
  moonLight.shadow.camera.far = 48;
  const sc = 12;
  moonLight.shadow.camera.left = -sc;
  moonLight.shadow.camera.right = sc;
  moonLight.shadow.camera.top = sc;
  moonLight.shadow.camera.bottom = -sc;
  moonLight.shadow.bias = -0.0005;
  scene.add(moonLight);

  // 3. Bright, Warm Golden-Cream Convenience Store Interior Lights (contrasting with the cool night!)
  const interiorMainLight = new THREE.PointLight(0xffdf9e, 4.8, 15, 1.35);
  interiorMainLight.position.set(-0.6, 3.3, -2.5);
  interiorMainLight.castShadow = true;
  diorama.add(interiorMainLight);

  const interiorFrontLight = new THREE.PointLight(0xffe7b3, 4.2, 13, 1.35);
  interiorFrontLight.position.set(0.8, 3.1, -0.4);
  diorama.add(interiorFrontLight);

  // Automatic door warm spill light onto the wet entrance mat & puddles (intensifies when doors open!)
  doorSpillLight = new THREE.PointLight(0xffcf75, 2.2, 8.5, 1.4);
  doorSpillLight.position.set(-2.1, 1.8, 1.9);
  diorama.add(doorSpillLight);

  // 4. Streetlight Warm Amber Pool at the Corner Intersection
  const streetLampLight = new THREE.PointLight(0xffca6b, 4.4, 16, 1.4);
  streetLampLight.position.set(4.37, 5.6, 3.73);
  streetLampLight.castShadow = true;
  diorama.add(streetLampLight);

  // 5. Vending Machine Cyan/Coral Glow on the Sidewalk
  const vendingGlow = new THREE.PointLight(0x64d2ff, 2.2, 7.5, 1.5);
  vendingGlow.position.set(3.4, 1.5, -5.2);
  diorama.add(vendingGlow);

  // 6. Narrow Alleyway Warm Red/Magenta Neon & Lantern Glow
  const alleyGlow = new THREE.PointLight(0xff3877, 2.6, 8.5, 1.5);
  alleyGlow.position.set(-5.6, 2.7, 0.4);
  diorama.add(alleyGlow);

  // 7. Traffic Signal Colored Reflection Light
  trafficSpotLight = new THREE.PointLight(0x10b981, 2.4, 11, 1.5);
  trafficSpotLight.position.set(-3.2, 4.3, 3.2);
  diorama.add(trafficSpotLight);
}

setupLighting();

// ============================================================================
// 8. DYNAMIC ANIMATIONS: RAINFALL, EAVES DRIPS & PUDDLE RIPPLES
// ============================================================================
// 8.1 Falling Rain Streaks (持续降雨)
const RAIN_COUNT = 1250;
const rainGeo = new THREE.BufferGeometry();
const rainPositions = new Float32Array(RAIN_COUNT * 6);
const rainSpeeds = new Float32Array(RAIN_COUNT);

for (let i = 0; i < RAIN_COUNT; i++) {
  const x = (Math.random() - 0.5) * 18.5;
  const y = Math.random() * 12.0;
  const z = (Math.random() - 0.5) * 18.5;
  const len = 0.52 + Math.random() * 0.35;
  rainSpeeds[i] = 13.5 + Math.random() * 5.5;

  rainPositions[i * 6 + 0] = x;
  rainPositions[i * 6 + 1] = y;
  rainPositions[i * 6 + 2] = z;
  rainPositions[i * 6 + 3] = x - 0.07; // slight wind slant
  rainPositions[i * 6 + 4] = y - len;
  rainPositions[i * 6 + 5] = z + 0.05;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));
const rainMat = new THREE.LineBasicMaterial({
  color: 0xa5c9ff,
  transparent: true,
  opacity: 0.42
});
const rainSystem = new THREE.LineSegments(rainGeo, rainMat);
diorama.add(rainSystem);

// 8.2 Awning Eaves Water Drips (屋檐滴水) & Expanding Ground Puddle Ripples (地面积水波纹)
const RIPPLE_COUNT = 44;
const ripples = [];
const rippleRingGeo = new THREE.RingGeometry(0.18, 0.24, 24);
rippleRingGeo.rotateX(-Math.PI / 2);

for (let i = 0; i < RIPPLE_COUNT; i++) {
  const rMat = new THREE.MeshBasicMaterial({
    color: 0xbae6fd,
    transparent: true,
    opacity: 0.0,
    depthWrite: false
  });
  const rMesh = new THREE.Mesh(rippleRingGeo, rMat);
  const isEaves = i < 16;
  let rx, rz, ry;
  if (isEaves) {
    // Directly under the convenience store front & side awning edges
    if (i < 10) {
      rx = -3.8 + (i / 9) * 6.8;
      rz = 2.32;
    } else {
      rx = 3.42;
      rz = -4.2 + ((i - 10) / 5) * 6.2;
    }
    ry = 0.195;
  } else {
    // Scattered across the wet asphalt road & puddles
    if (Math.random() < 0.55) {
      rx = -7.8 + Math.random() * 15.8;
      rz = 3.4 + Math.random() * 5.2;
    } else {
      rx = 4.0 + Math.random() * 4.6;
      rz = -8.2 + Math.random() * 16.4;
    }
    ry = 0.022;
  }

  rMesh.position.set(rx, ry, rz);
  diorama.add(rMesh);

  // Optional falling droplet bead for awning eaves drips
  let dropMesh = null;
  if (isEaves) {
    dropMesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.032, 6, 6),
      new THREE.MeshBasicMaterial({ color: 0xdff6ff, transparent: true, opacity: 0.85 })
    );
    dropMesh.scale.set(0.7, 2.2, 0.7);
    dropMesh.position.set(rx, 3.25, rz);
    diorama.add(dropMesh);
  }

  ripples.push({
    mesh: rMesh,
    mat: rMat,
    dropMesh,
    progress: Math.random(),
    speed: isEaves ? 0.85 + Math.random() * 0.35 : 1.1 + Math.random() * 0.65,
    maxScale: isEaves ? 0.95 : 1.35
  });
}

// ============================================================================
// 9. ANIMATION LOOP (DOORS, NEON FLICKER, TRAFFIC LIGHTS, RAIN, RIPPLES)
// ============================================================================
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.getElapsedTime();

  controls.update();

  // 1. Update Rain Streaks
  const posAttr = rainGeo.attributes.position;
  const arr = posAttr.array;
  for (let i = 0; i < RAIN_COUNT; i++) {
    const dy = rainSpeeds[i] * dt;
    arr[i * 6 + 1] -= dy;
    arr[i * 6 + 4] -= dy;
    if (arr[i * 6 + 1] < 0.05) {
      const resetY = 11.2 + Math.random() * 1.5;
      const len = arr[i * 6 + 1] - arr[i * 6 + 4];
      arr[i * 6 + 1] = resetY;
      arr[i * 6 + 4] = resetY - len;
    }
  }
  posAttr.needsUpdate = true;

  // 2. Update Eaves Water Drops & Expanding Ground Puddle Ripples
  for (const r of ripples) {
    r.progress += r.speed * dt;
    if (r.progress >= 1.0) {
      r.progress = 0.0;
    }
    if (r.dropMesh) {
      // First 35% of cycle: droplet falls from awning to sidewalk
      if (r.progress < 0.35) {
        const fallT = r.progress / 0.35;
        r.dropMesh.visible = true;
        r.dropMesh.position.y = 3.28 - fallT * 3.08;
        r.mat.opacity = 0;
      } else {
        // Remaining 65%: expanding ripple ring on sidewalk
        r.dropMesh.visible = false;
        const ringT = (r.progress - 0.35) / 0.65;
        const s = 0.2 + ringT * r.maxScale;
        r.mesh.scale.set(s, 1, s);
        r.mat.opacity = (1.0 - ringT) * 0.65;
      }
    } else {
      const s = 0.2 + r.progress * r.maxScale;
      r.mesh.scale.set(s, 1, s);
      r.mat.opacity = (1.0 - r.progress) * 0.55;
    }
  }

  // 3. Update Rainwater Sliding Down Storefront Windows
  updateWindowRainTexture(dt);

  // 4. Automatic Sliding Doors Occasional Opening & Closing (every 11s cycle)
  const doorPhase = elapsed % 11.0;
  let doorOpenRatio = 0;
  if (doorPhase > 2.0 && doorPhase < 6.2) {
    if (doorPhase < 3.0) {
      doorOpenRatio = THREE.MathUtils.smoothstep(doorPhase, 2.0, 3.0);
    } else if (doorPhase < 5.2) {
      doorOpenRatio = 1.0;
    } else {
      doorOpenRatio = 1.0 - THREE.MathUtils.smoothstep(doorPhase, 5.2, 6.2);
    }
  }
  if (autoDoorLeft && autoDoorRight) {
    autoDoorLeft.position.x = -1.84 - doorOpenRatio * 0.76;
    autoDoorRight.position.x = -0.86 + doorOpenRatio * 0.76;
    doorSpillLight.intensity = 2.1 + doorOpenRatio * 2.4;
  }

  // 5. Convenience Store Signboard & Alley Neon Sign Subtle Flicker (便利店招牌或灯箱轻微闪烁)
  if (storeSignFasciaMat) {
    const hum = 0.9 + Math.sin(elapsed * 23.0) * 0.025;
    const microFlicker = Math.sin(elapsed * 3.7) > 0.96 && Math.sin(elapsed * 61.0) > 0.2 ? 0.68 : hum;
    storeSignFasciaMat.emissiveIntensity = microFlicker;
  }
  if (alleyNeonSignMat) {
    const neonFlicker = Math.sin(elapsed * 5.2) > 0.92 && Math.sin(elapsed * 47.0) > 0.0 ? 0.45 : 1.45;
    alleyNeonSignMat.emissiveIntensity = neonFlicker;
  }

  // 6. Corner Traffic Signal Subtle State Changes (远处交通信号灯微弱变化)
  const sigCycle = elapsed % 15.0;
  if (sigCycle < 6.5) {
    // Emerald Green
    trafficGreenMat.color.setHex(0x10b981);
    trafficYellowMat.color.setHex(0x2a1f04);
    trafficRedMat.color.setHex(0x300808);
    trafficSpotLight.color.setHex(0x10b981);
  } else if (sigCycle < 8.5) {
    // Amber Yellow
    trafficGreenMat.color.setHex(0x063224);
    trafficYellowMat.color.setHex(0xfbbf24);
    trafficRedMat.color.setHex(0x300808);
    trafficSpotLight.color.setHex(0xfbbf24);
  } else {
    // Ruby Red
    trafficGreenMat.color.setHex(0x063224);
    trafficYellowMat.color.setHex(0x2a1f04);
    trafficRedMat.color.setHex(0xff2e38);
    trafficSpotLight.color.setHex(0xff2e38);
  }

  // 7. Rotate AC Outdoor Unit Fans & Animate Oden Steam Puffs
  for (const fan of acFanMeshes) {
    fan.rotation.x += dt * 9.5;
  }
  for (const puff of odenSteamParticles) {
    const t = (elapsed * puff.userData.speed + puff.userData.phase) % 1.0;
    puff.position.y = puff.userData.baseY + t * 0.52;
    puff.material.opacity = Math.sin(t * Math.PI) * 0.42;
  }

  renderer.render(scene, camera);
}

animate();

// Responsive resize handling
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script>
