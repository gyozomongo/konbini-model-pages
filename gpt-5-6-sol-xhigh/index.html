<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>雨夜便利店街角微缩场景</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #22314a 0%, #101726 45%, #0a0f18 100%);
      font-family: system-ui, sans-serif;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
  <script>
    class MiniOrbitControls {
      constructor(camera, domElement) {
        this.camera = camera;
        this.domElement = domElement;
        this.target = new THREE.Vector3();
        this.enableDamping = true;
        this.dampingFactor = 0.05;
        this.minDistance = 1;
        this.maxDistance = 100;
        this.minPolarAngle = 0.01;
        this.maxPolarAngle = Math.PI - 0.01;
        this.enablePan = true;
        this._initialized = false;
        this._theta = 0;
        this._phi = Math.PI / 3;
        this._radius = 20;
        this._desiredTheta = 0;
        this._desiredPhi = Math.PI / 3;
        this._desiredRadius = 20;
        this._pointer = null;
        this._lastX = 0;
        this._lastY = 0;
        this._touchDistance = 0;
        this.domElement.style.touchAction = 'none';
        this.domElement.addEventListener('contextmenu', e => e.preventDefault());
        this.domElement.addEventListener('pointerdown', e => this._down(e));
        window.addEventListener('pointermove', e => this._move(e));
        window.addEventListener('pointerup', e => this._up(e));
        this.domElement.addEventListener('wheel', e => this._wheel(e), { passive: false });
        this.domElement.addEventListener('touchstart', e => this._touchStart(e), { passive: false });
        this.domElement.addEventListener('touchmove', e => this._touchMove(e), { passive: false });
      }
      _sync() {
        const v = this.camera.position.clone().sub(this.target);
        const s = new THREE.Spherical().setFromVector3(v);
        this._theta = this._desiredTheta = s.theta;
        this._phi = this._desiredPhi = s.phi;
        this._radius = this._desiredRadius = s.radius;
        this._initialized = true;
      }
      _down(e) {
        if (e.pointerType === 'touch') return;
        this._pointer = e.button;
        this._lastX = e.clientX;
        this._lastY = e.clientY;
      }
      _move(e) {
        if (this._pointer === null || e.pointerType === 'touch') return;
        const dx = e.clientX - this._lastX;
        const dy = e.clientY - this._lastY;
        this._lastX = e.clientX;
        this._lastY = e.clientY;
        if (this._pointer === 0) {
          this._desiredTheta -= dx * 0.006;
          this._desiredPhi -= dy * 0.006;
          this._desiredPhi = THREE.MathUtils.clamp(this._desiredPhi, this.minPolarAngle, this.maxPolarAngle);
        } else if (this.enablePan) {
          this._pan(dx, dy);
        }
      }
      _up() { this._pointer = null; }
      _wheel(e) {
        e.preventDefault();
        this._desiredRadius *= Math.exp(e.deltaY * 0.0012);
        this._desiredRadius = THREE.MathUtils.clamp(this._desiredRadius, this.minDistance, this.maxDistance);
      }
      _pan(dx, dy) {
        const dist = this._desiredRadius;
        const scale = dist * 0.0017;
        this.camera.updateMatrixWorld();
        const right = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 0);
        const up = new THREE.Vector3().setFromMatrixColumn(this.camera.matrixWorld, 1);
        this.target.addScaledVector(right, -dx * scale);
        this.target.addScaledVector(up, dy * scale);
      }
      _touchStart(e) {
        e.preventDefault();
        if (e.touches.length === 1) {
          this._lastX = e.touches[0].clientX;
          this._lastY = e.touches[0].clientY;
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          this._touchDistance = Math.hypot(dx, dy);
        }
      }
      _touchMove(e) {
        e.preventDefault();
        if (e.touches.length === 1) {
          const x = e.touches[0].clientX;
          const y = e.touches[0].clientY;
          this._desiredTheta -= (x - this._lastX) * 0.006;
          this._desiredPhi -= (y - this._lastY) * 0.006;
          this._desiredPhi = THREE.MathUtils.clamp(this._desiredPhi, this.minPolarAngle, this.maxPolarAngle);
          this._lastX = x;
          this._lastY = y;
        } else if (e.touches.length === 2) {
          const dx = e.touches[0].clientX - e.touches[1].clientX;
          const dy = e.touches[0].clientY - e.touches[1].clientY;
          const d = Math.hypot(dx, dy);
          if (this._touchDistance > 0) {
            this._desiredRadius *= this._touchDistance / d;
            this._desiredRadius = THREE.MathUtils.clamp(this._desiredRadius, this.minDistance, this.maxDistance);
          }
          this._touchDistance = d;
        }
      }
      update() {
        if (!this._initialized) this._sync();
        const f = this.enableDamping ? Math.max(0.02, this.dampingFactor * 2.6) : 1;
        this._theta += (this._desiredTheta - this._theta) * f;
        this._phi += (this._desiredPhi - this._phi) * f;
        this._radius += (this._desiredRadius - this._radius) * f;
        const s = new THREE.Spherical(this._radius, this._phi, this._theta);
        const v = new THREE.Vector3().setFromSpherical(s).add(this.target);
        this.camera.position.copy(v);
        this.camera.lookAt(this.target);
      }
    }


    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x0e1523, 24, 60);

    const camera = new THREE.PerspectiveCamera(48, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(16, 13, 16);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new MiniOrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0.8, 2.4, 0.6);
    controls.minDistance = 11;
    controls.maxDistance = 32;
    controls.maxPolarAngle = Math.PI * 0.49;
    controls.minPolarAngle = Math.PI * 0.17;
    controls.enablePan = true;

    const ambient = new THREE.HemisphereLight(0xbfd4ff, 0x0c1020, 1.4);
    scene.add(ambient);

    const moonLight = new THREE.DirectionalLight(0x91b4ff, 1.2);
    moonLight.position.set(-10, 15, 8);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.set(2048, 2048);
    moonLight.shadow.camera.left = -20;
    moonLight.shadow.camera.right = 20;
    moonLight.shadow.camera.top = 20;
    moonLight.shadow.camera.bottom = -20;
    scene.add(moonLight);

    const sceneGroup = new THREE.Group();
    scene.add(sceneGroup);

    const animated = {
      signLights: [],
      door: null,
      drips: [],
      ripples: [],
      glassDrops: [],
      trafficLights: [],
      neonPanels: [],
      rainPositions: null,
      rainSpeeds: null,
      rainGeom: null,
    };

    const clock = new THREE.Clock();

    function toon(color, emissive = 0x000000) {
      return new THREE.MeshToonMaterial({ color, emissive });
    }

    function shiny(color, roughness = 0.25, metalness = 0.03, opacity = 1) {
      return new THREE.MeshStandardMaterial({
        color,
        roughness,
        metalness,
        transparent: opacity < 1,
        opacity,
      });
    }

    function glass(opacity = 0.28, color = 0xb7ddff) {
      return new THREE.MeshPhysicalMaterial({
        color,
        roughness: 0.08,
        transmission: 0.15,
        transparent: true,
        opacity,
        thickness: 0.2,
        clearcoat: 1,
        clearcoatRoughness: 0.1,
      });
    }

    function addOutline(mesh, color = 0x243040) {
      const edges = new THREE.EdgesGeometry(mesh.geometry, 35);
      const line = new THREE.LineSegments(
        edges,
        new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.7 })
      );
      line.renderOrder = 3;
      line.position.copy(mesh.position);
      line.rotation.copy(mesh.rotation);
      line.scale.copy(mesh.scale);
      mesh.parent?.add(line);
      return line;
    }

    function makeLabelTexture(text, options = {}) {
      const {
        w = 512,
        h = 128,
        background = '#ffffff',
        color = '#1c2840',
        accent = null,
        stripes = null,
        border = null,
        font = 'bold 56px sans-serif',
        small = null,
      } = options;
      const canvas = document.createElement('canvas');
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = background;
      ctx.fillRect(0, 0, w, h);

      if (stripes) {
        const stripeH = h / (stripes.length + 2);
        stripes.forEach((s, i) => {
          ctx.fillStyle = s;
          ctx.fillRect(0, stripeH * (i + 1), w, stripeH);
        });
      }

      if (accent) {
        ctx.fillStyle = accent;
        ctx.fillRect(16, 12, w - 32, h - 24);
      }

      if (border) {
        ctx.strokeStyle = border;
        ctx.lineWidth = 10;
        ctx.strokeRect(6, 6, w - 12, h - 12);
      }

      ctx.fillStyle = color;
      ctx.font = font;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(text, w / 2, h / 2 + 2);

      if (small) {
        ctx.fillStyle = color;
        ctx.font = '22px sans-serif';
        ctx.fillText(small, w / 2, h - 22);
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function makePoster(text, c1, c2) {
      const canvas = document.createElement('canvas');
      canvas.width = 256;
      canvas.height = 384;
      const ctx = canvas.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, 384);
      g.addColorStop(0, c1);
      g.addColorStop(1, c2);
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, 256, 384);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillRect(20, 20, 216, 344);
      ctx.fillStyle = '#23304a';
      ctx.font = 'bold 34px sans-serif';
      ctx.textAlign = 'center';
      const lines = text.split('\n');
      lines.forEach((line, i) => ctx.fillText(line, 128, 90 + i * 44));
      ctx.fillStyle = '#6f7d96';
      for (let i = 0; i < 8; i++) {
        ctx.fillRect(44, 180 + i * 18, 168, 8);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    function createMesh(geo, mat, x, y, z, rx = 0, ry = 0, rz = 0, cast = true, receive = true) {
      const m = new THREE.Mesh(geo, mat);
      m.position.set(x, y, z);
      m.rotation.set(rx, ry, rz);
      m.castShadow = cast;
      m.receiveShadow = receive;
      return m;
    }

    // Base
    const base = createMesh(
      new THREE.BoxGeometry(20, 1.2, 20),
      shiny(0x2f3c4d, 0.55, 0.02),
      0, -0.6, 0
    );
    sceneGroup.add(base);

    const baseTop = createMesh(
      new THREE.BoxGeometry(19.3, 0.12, 19.3),
      shiny(0x56657b, 0.85, 0),
      0, 0.02, 0,
      0, 0, 0,
      false,
      true
    );
    sceneGroup.add(baseTop);

    // Roads and sidewalks
    const roadMat = shiny(0x3f4756, 0.45, 0.02);
    const sidewalkMat = toon(0x7a8596);
    const curbMat = toon(0xb8c0cc);

    const road1 = createMesh(new THREE.BoxGeometry(18, 0.06, 6.8), roadMat, 0, 0.08, 5.8, 0, 0, 0, false, true);
    const road2 = createMesh(new THREE.BoxGeometry(6.8, 0.06, 18), roadMat, 5.8, 0.08, 0, 0, 0, 0, false, true);
    sceneGroup.add(road1, road2);

    const sidewalk1 = createMesh(new THREE.BoxGeometry(18, 0.22, 1.5), sidewalkMat, 0, 0.17, 1.55);
    const sidewalk2 = createMesh(new THREE.BoxGeometry(1.5, 0.22, 18), sidewalkMat, 1.55, 0.17, 0);
    sceneGroup.add(sidewalk1, sidewalk2);

    const curb1 = createMesh(new THREE.BoxGeometry(18, 0.16, 0.18), curbMat, 0, 0.28, 2.28, 0, 0, 0, false, true);
    const curb2 = createMesh(new THREE.BoxGeometry(0.18, 0.16, 18), curbMat, 2.28, 0.28, 0, 0, 0, 0, false, true);
    sceneGroup.add(curb1, curb2);

    // Crosswalk stripes
    for (let i = 0; i < 6; i++) {
      const stripe = createMesh(
        new THREE.BoxGeometry(1.35, 0.02, 0.35),
        shiny(0xd8dfed, 0.25, 0.02),
        -4.3 + i * 1.55,
        0.11,
        3.95,
        0,
        0,
        0,
        false,
        true
      );
      sceneGroup.add(stripe);
    }
    for (let i = 0; i < 6; i++) {
      const stripe = createMesh(
        new THREE.BoxGeometry(0.35, 0.02, 1.35),
        shiny(0xd8dfed, 0.25, 0.02),
        3.95,
        0.11,
        -4.3 + i * 1.55,
        0,
        0,
        0,
        false,
        true
      );
      sceneGroup.add(stripe);
    }

    // Parking spot
    const parkingLines = new THREE.Group();
    for (let i = 0; i < 3; i++) {
      const line1 = createMesh(new THREE.BoxGeometry(0.08, 0.02, 2.1), shiny(0xe8f0ff, 0.2), -6.5 + i * 1.6, 0.11, 8.1, 0, 0, 0, false, true);
      parkingLines.add(line1);
    }
    const headLine = createMesh(new THREE.BoxGeometry(4.8, 0.02, 0.08), shiny(0xe8f0ff, 0.2), -4.9, 0.11, 9.15, 0, 0, 0, false, true);
    parkingLines.add(headLine);
    sceneGroup.add(parkingLines);

    // Drainage channel
    const drain = createMesh(new THREE.BoxGeometry(4.2, 0.03, 0.36), shiny(0x222932, 0.9, 0.1), -2.9, 0.1, 2.15, 0, 0, 0, false, true);
    sceneGroup.add(drain);
    for (let i = 0; i < 7; i++) {
      const grate = createMesh(new THREE.BoxGeometry(0.04, 0.02, 0.3), toon(0x7b8797), -4.6 + i * 0.28, 0.12, 2.15, 0, 0, 0, false, true);
      sceneGroup.add(grate);
    }

    // Puddles
    const puddleGroup = new THREE.Group();
    sceneGroup.add(puddleGroup);
    const puddlePositions = [
      [-3.8, 0.105, 6.6, 1.9, 1.2],
      [5.2, 0.105, -2.1, 1.4, 1.0],
      [0.8, 0.105, 5.0, 1.3, 0.95],
      [6.8, 0.105, 6.9, 1.0, 0.8],
    ];
    puddlePositions.forEach((p, idx) => {
      const puddle = createMesh(
        new THREE.CircleGeometry(1, 40),
        new THREE.MeshPhysicalMaterial({
          color: 0x88a6c7,
          transparent: true,
          opacity: 0.32,
          roughness: 0.05,
          transmission: 0,
          clearcoat: 1,
          clearcoatRoughness: 0.08,
        }),
        p[0], p[1], p[2], -Math.PI / 2, 0, 0, false, true
      );
      puddle.scale.set(p[3], p[4], 1);
      puddleGroup.add(puddle);
      for (let i = 0; i < 2; i++) {
        const ripple = createMesh(
          new THREE.RingGeometry(0.08, 0.11, 32),
          new THREE.MeshBasicMaterial({ color: 0xcce6ff, transparent: true, opacity: 0.35, side: THREE.DoubleSide }),
          p[0] + (Math.random() - 0.5) * 0.5,
          p[1] + 0.002,
          p[2] + (Math.random() - 0.5) * 0.5,
          -Math.PI / 2,
          0,
          0,
          false,
          false
        );
        ripple.userData = { phase: Math.random(), baseScale: 1, speed: 0.5 + Math.random() * 0.45 };
        puddleGroup.add(ripple);
        animated.ripples.push(ripple);
      }
    });

    // Miniature convenience store
    const store = new THREE.Group();
    sceneGroup.add(store);
    store.position.set(0.6, 0.12, -0.1);

    const wallMat = toon(0xf2f5fa);
    const trimMat = toon(0xd9e1ea);
    const darkTrim = toon(0x445164);
    const warmFloor = toon(0xefebdf);

    const storeBody = new THREE.Group();
    const backWall = createMesh(new THREE.BoxGeometry(8.2, 4.3, 0.18), wallMat, 0, 2.15, -3.11);
    const leftWall = createMesh(new THREE.BoxGeometry(0.18, 4.3, 6.4), wallMat, -4.01, 2.15, 0);
    const frontLow = createMesh(new THREE.BoxGeometry(8.2, 0.48, 0.18), wallMat, 0, 0.36, 3.11);
    const frontTop = createMesh(new THREE.BoxGeometry(8.2, 0.42, 0.18), wallMat, 0, 3.34, 3.11);
    const sideLow = createMesh(new THREE.BoxGeometry(0.18, 0.48, 6.4), wallMat, 4.01, 0.36, 0);
    const sideTop = createMesh(new THREE.BoxGeometry(0.18, 0.42, 6.4), wallMat, 4.01, 3.34, 0);
    storeBody.add(backWall, leftWall, frontLow, frontTop, sideLow, sideTop);
    store.add(storeBody);
    [backWall, leftWall, frontLow, frontTop, sideLow, sideTop].forEach(m => addOutline(m));

    const flatRoof = createMesh(new THREE.BoxGeometry(8.7, 0.36, 6.9), toon(0x556273), 0, 4.55, 0);
    store.add(flatRoof);
    addOutline(flatRoof);

    const awning = createMesh(new THREE.BoxGeometry(8.55, 0.16, 1.3), toon(0x7e8fa2), 0, 3.6, 2.95);
    store.add(awning);
    addOutline(awning);

    const sideAwning = createMesh(new THREE.BoxGeometry(1.2, 0.16, 6.65), toon(0x7e8fa2), 4.1, 3.6, 0);
    store.add(sideAwning);
    addOutline(sideAwning);

    // Sign band
    const signTex = makeLabelTexture('MINI 24', {
      w: 1024,
      h: 180,
      background: '#f7fafc',
      color: '#23314a',
      stripes: ['#48b67d', '#f6a44f', '#5ca8f1'],
      font: 'bold 86px sans-serif',
      small: 'OPEN ALL NIGHT',
    });
    const signMat = new THREE.MeshStandardMaterial({ map: signTex, emissive: 0xffffff, emissiveIntensity: 0.72, roughness: 0.35 });
    const frontSign = createMesh(new THREE.PlaneGeometry(7.9, 1.15), signMat, 0, 3.92, 3.23, 0, 0, 0, false, false);
    store.add(frontSign);
    animated.signLights.push(frontSign.material);

    const sideSign = createMesh(new THREE.PlaneGeometry(6.15, 1.15), signMat.clone(), 4.23, 3.92, 0, 0, -Math.PI / 2, 0, false, false);
    store.add(sideSign);
    animated.signLights.push(sideSign.material);

    // Interior floor and ceiling lights
    const interiorFloor = createMesh(new THREE.BoxGeometry(7.8, 0.06, 6.0), warmFloor, 0, 0.24, 0, 0, 0, 0, false, true);
    store.add(interiorFloor);
    const ceiling = createMesh(new THREE.BoxGeometry(7.8, 0.12, 6.0), toon(0xf8fbff), 0, 4.08, 0, 0, 0, 0, false, true);
    store.add(ceiling);

    // Front and side window strips
    const glassMat = glass(0.23);
    const frontWindow = createMesh(new THREE.PlaneGeometry(6.0, 2.45), glassMat, -0.65, 1.95, 3.22, 0, 0, 0, false, false);
    const frontWindow2 = createMesh(new THREE.PlaneGeometry(1.45, 2.45), glassMat.clone(), 3.0, 1.95, 3.22, 0, 0, 0, false, false);
    const sideWindow = createMesh(new THREE.PlaneGeometry(4.75, 2.45), glassMat.clone(), 4.21, 1.95, -0.4, 0, -Math.PI / 2, 0, false, false);
    store.add(frontWindow, frontWindow2, sideWindow);

    // Door frame
    const doorFrameTop = createMesh(new THREE.BoxGeometry(1.55, 0.12, 0.08), trimMat, 2.05, 3.05, 3.2);
    const doorFrameL = createMesh(new THREE.BoxGeometry(0.08, 2.25, 0.08), trimMat, 1.28, 1.98, 3.2);
    const doorFrameR = createMesh(new THREE.BoxGeometry(0.08, 2.25, 0.08), trimMat, 2.82, 1.98, 3.2);
    store.add(doorFrameTop, doorFrameL, doorFrameR);

    const doorLeft = createMesh(new THREE.BoxGeometry(0.68, 2.2, 0.04), glass(0.22), 1.72, 1.95, 3.18, 0, 0, 0, false, false);
    const doorRight = createMesh(new THREE.BoxGeometry(0.68, 2.2, 0.04), glass(0.22), 2.38, 1.95, 3.18, 0, 0, 0, false, false);
    const handleL = createMesh(new THREE.BoxGeometry(0.03, 0.46, 0.03), shiny(0xc7d3e0, 0.2, 0.3), 1.98, 1.95, 3.23, 0, 0, 0, false, false);
    const handleR = createMesh(new THREE.BoxGeometry(0.03, 0.46, 0.03), shiny(0xc7d3e0, 0.2, 0.3), 2.12, 1.95, 3.23, 0, 0, 0, false, false);
    store.add(doorLeft, doorRight, handleL, handleR);
    animated.door = { left: doorLeft, right: doorRight, handleL, handleR };

    // Interior warm lights
    const insideLight1 = new THREE.PointLight(0xfff2c6, 1.7, 18);
    insideLight1.position.set(-1.5, 3.2, 0.2);
    const insideLight2 = new THREE.PointLight(0xfff1bf, 1.55, 18);
    insideLight2.position.set(1.8, 3.2, -0.3);
    const insideLight3 = new THREE.PointLight(0xffeec0, 1.0, 10);
    insideLight3.position.set(3.1, 2.3, 1.1);
    store.add(insideLight1, insideLight2, insideLight3);

    // Ceiling light boxes
    for (let i = 0; i < 3; i++) {
      const lightBox = createMesh(
        new THREE.BoxGeometry(1.7, 0.08, 0.5),
        new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xfff2bf, emissiveIntensity: 1.0 }),
        -2.1 + i * 2.2,
        3.82,
        -0.3
      );
      store.add(lightBox);
      animated.neonPanels.push(lightBox.material);
    }

    // Shelves helper
    function createShelf(x, z, w, h, d, levels = 3, products = 18) {
      const g = new THREE.Group();
      const frame = createMesh(new THREE.BoxGeometry(w, h, d), toon(0xe9edf3), x, h / 2 + 0.25, z);
      g.add(frame);
      addOutline(frame, 0x687589);
      const shelfBase = createMesh(new THREE.BoxGeometry(w - 0.1, 0.06, d - 0.1), toon(0xd0d8e3), x, 0.28, z, 0, 0, 0, false, true);
      g.add(shelfBase);
      for (let lv = 0; lv < levels; lv++) {

      }
      const slide = open * 0.42;
      animated.door.left.position.x = 1.72 - slide * 0.5;
      animated.door.right.position.x = 2.38 + slide * 0.5;
      animated.door.handleL.position.x = 1.98 - slide * 0.5;
      animated.door.handleR.position.x = 2.12 + slide * 0.5;

        r.scale.setScalar(s);
        r.material.opacity = (1 - u) * 0.28;
      });
    }

    function animateDrips(dt) {
      animated.drips.forEach((d) => {
        d.userData.delay -= dt;
        if (d.userData.delay > 0) return;
        d.position.y -= d.userData.speed * 5.2 * dt * 60;
        d.material.opacity = 0.25 + Math.max(0, (d.position.y - 0.2) / 3.2) * 0.6;
        if (d.position.y < d.userData.minY) {
          d.position.y = d.userData.startY + Math.random() * 0.12;
          d.userData.delay = Math.random() * 1.2;
          d.material.opacity = 0.75;
        }
      });
    }

        if (g.position.y < g.userData.startY - g.userData.range) {
          g.position.y = g.userData.startY + Math.random() * 0.12;
        }
      });
    }

    function animateLights(t) {
      animated.signLights.forEach((m, i) => {
        m.emissiveIntensity = 0.62 + Math.sin(t * 2.4 + i) * 0.05 + (Math.sin(t * 8.0 + i * 1.7) > 0.97 ? -0.12 : 0);
      });
      animated.neonPanels.forEach((m, i) => {
        m.emissiveIntensity = 0.9 + Math.sin(t * 1.8 + i * 0.8) * 0.06;
      });
      const mode = Math.floor((t * 0.45) % 3);
      animated.trafficLights.forEach((m, i) => {
        const base = 0.1;
        const target = i === (2 - mode) ? 0.88 : base;
        m.emissiveIntensity += (target - m.emissiveIntensity) * 0.08;
      });
    }

    function animateScene(dt, t) {
      animateDoor(t);
      animateRipples(t);
      animateDrips(dt);
      animateGlassDrops(dt * 2.5);
      animateRain(dt);
      animateLights(t);
      fan.rotation.x += dt * 8;
      baseShadow.material.opacity = 0.12 + Math.sin(t * 0.6) * 0.01;
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function render() {
      requestAnimationFrame(render);
      const dt = Math.min(clock.getDelta(), 0.03);
      const t = clock.elapsedTime;
      animateScene(dt, t);
      controls.update();
      renderer.render(scene, camera);
    }

    render();
  </script>
</body>
</html>
